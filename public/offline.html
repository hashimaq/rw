<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b91c1c" />
    <link rel="icon" href="/brand/rwings.jpg" type="image/jpeg" />
    <title>Red Wings Cricket — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f3f4f8;
        color: #0f1218;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 5rem;
        height: 5rem;
        border-radius: 1rem;
        object-fit: cover;
        border: 1px solid #fecaca;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/rwings.jpg" alt="Red Wings Cricket" width="80" height="80" />
      <h1>You&apos;re offline</h1>
      <p>
        Open Red Wings from your installed app when you&apos;re back online, or
        try again once your connection returns.
      </p>
    </main>
  </body>
</html>
